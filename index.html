<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Words 每日单词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="noprint">
    <h1>Daily Words<small>每日单词 · 记忆 + 默写</small></h1>
    <div id="stats"></div>
    <div class="bar">
      <select id="set" aria-label="Word set 选择单词"></select>
      <div class="tabs" role="group" aria-label="Mode 模式">
        <button data-mode="cards">Cards<small>认词</small></button>
        <button data-mode="write">Write<small>默写</small></button>
        <button data-mode="listen">Listen<small>听写</small></button>
        <button data-mode="print">Print<small>打印</small></button>
      </div>
    </div>
  </header>
  <main id="app"><p class="muted">Loading… 加载中…</p></main>
  <footer id="footer" class="noprint"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
